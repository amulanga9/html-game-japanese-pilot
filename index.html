<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字55 — Basic Kanji Book Vol.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #08080a;
    --ink: #eef0f2;
    --ink-soft: #83858f;
    --green: #00e28a;
    --green-soft: rgba(0,226,138,0.09);
    --purple: #9d6bff;
    --purple-soft: rgba(157,107,255,0.12);
    --border: rgba(255,255,255,0.12);
    --card: rgba(20,20,24,0.65);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(rgba(0,226,138,0.10) 1px, transparent 1px),
      radial-gradient(rgba(157,107,255,0.08) 1px, transparent 1px);
    background-size: 28px 28px, 28px 28px;
    background-position: 0 0, 14px 14px;
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    padding: 60px 16px 60px;
  }

  .wrap { max-width: 980px; margin: 0 auto; position: relative; }

  button.reshuffle {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    font-family: inherit;
    font-size: 17px;
    background: transparent;
    color: var(--green);
    border: 1.5px solid var(--green);
    border-radius: 8px;
    cursor: pointer;
    transition: transform .12s ease, background .12s ease, color .12s ease;
    z-index: 10;
  }
  button.reshuffle:hover { background: var(--green); color: #04140d; }
  button.reshuffle:active { transform: scale(0.92); }
  button.reshuffle:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(66px, 1fr));
    gap: 8px;
  }

  .cell {
    position: relative;
    aspect-ratio: 1 / 1;
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(2px);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(13px, 2vw, 15px);
    font-weight: 500;
    color: var(--ink-soft);
    transition: transform .12s ease, border-color .15s ease, background .15s ease, color .15s ease;
  }

  .cell:hover { border-color: var(--green); color: var(--green); transform: translateY(-2px); }
  .cell:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  .cell.opened { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .cell.revealed { background: var(--purple-soft); border-color: var(--purple); color: var(--purple); }

  /* overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(2,2,3,0.72);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .overlay.show { display: flex; }

  .card {
    background: var(--card);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%;
    max-width: 380px;
    padding: 30px 24px 22px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--green), var(--purple));
  }

  .card .num {
    position: absolute;
    top: 16px;
    left: 18px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }

  .card .close {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    color: var(--ink-soft);
    padding: 6px;
    font-family: inherit;
  }
  .card .close:hover { color: var(--purple); }

  .word-zone {
    text-align: center;
    padding: 14px 0 10px;
  }

  .hira {
    font-family: 'Shippori Mincho', serif;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.06em;
    min-height: 52px;
  }

  .meaning {
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 600;
    margin-top: 4px;
  }
  .meaning-uz {
    color: var(--purple);
    font-style: italic;
    font-weight: 500;
  }
  .ex-mean-uz {
    display: block;
    color: var(--ink-soft);
    font-style: italic;
    font-weight: 400;
    font-size: 11.5px;
    line-height: 1.5;
    margin-top: 1px;
    opacity: 0.75;
  }

  .readings {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 16px 0 6px;
    flex-wrap: wrap;
    align-items: stretch;
  }
  .read-tag {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px 13px;
    font-size: 13px;
    min-width: 150px;
    flex: 1 1 150px;
    text-align: left;
    background: rgba(255,255,255,0.02);
  }
  .read-tag.on { border-color: rgba(0,226,138,0.35); }
  .read-tag.kun { border-color: rgba(157,107,255,0.35); }
  .read-tag .label {
    font-weight: 700;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    display: block;
    margin-bottom: 6px;
  }
  .read-tag.on .label, .read-tag.on .reading { color: var(--green); }
  .read-tag.kun .label, .read-tag.kun .reading { color: var(--purple); }
  .read-tag .reading {
    display: block;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--ink);
  }
  .read-tag .example {
    display: block;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }
  .read-tag .ex-word {
    display: block;
    font-family: 'Shippori Mincho', serif;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--ink);
  }
  .read-tag .ex-mean {
    display: block;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--ink-soft);
    font-weight: 400;
    margin-top: 4px;
  }
  .read-tag .no-ex {
    display: block;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--ink-soft);
    font-style: italic;
  }

  .reveal-zone {
    margin-top: 18px;
    text-align: center;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .hint-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .hint-char {
    font-family: 'Shippori Mincho', serif;
    font-size: 40px;
    font-weight: 700;
    color: var(--green);
    border: 2px dashed var(--green);
    border-radius: 10px;
    width: 70px;
    height: 70px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--green-soft);
  }
  .hint-note {
    font-size: 11.5px;
    color: var(--ink-soft);
    text-align: center;
    max-width: 260px;
    line-height: 1.4;
  }

  .stamp-btn {
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    background: transparent;
    color: var(--green);
    border: 1.5px solid var(--green);
    border-radius: 999px;
    padding: 11px 22px;
    cursor: pointer;
    transition: transform .12s ease, background .12s ease, color .12s ease;
  }
  .stamp-btn:hover { background: var(--green); color: #04140d; }
  .stamp-btn:active { transform: scale(0.95); }
  .stamp-btn:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  .kanji-answer {
    font-family: 'Shippori Mincho', serif;
    font-size: 64px;
    font-weight: 700;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 110px;
    height: 110px;
    border: 2px solid var(--purple);
    border-radius: 10px;
    background: var(--purple-soft);
    box-shadow: 0 0 26px rgba(157,107,255,0.30), 0 0 14px rgba(0,226,138,0.15);
    cursor: pointer;
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: no-preference) {
    .kanji-answer { animation: pixelin .3s steps(4) ; }
  }
  @keyframes pixelin {
    0%   { opacity: 0; transform: scale(0.85); filter: brightness(2); }
    50%  { opacity: 0.7; }
    100% { opacity: 1; transform: scale(1); filter: brightness(1); }
  }

  .kanji-full {
    position: fixed;
    inset: 0;
    background: rgba(4,4,6,0.94);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: pointer;
  }
  .kanji-full.show { display: flex; }
  #kanjiFullChar {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: min(58vw, 58vh);
    line-height: 1;
    color: var(--ink);
    white-space: nowrap;
    text-shadow: 0 0 70px rgba(157,107,255,0.55), 0 0 34px rgba(0,226,138,0.35);
  }
  @media (prefers-reduced-motion: no-preference) {
    #kanjiFullChar { animation: pixelin .35s steps(5); }
  }

  .kanji-full-readings {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .kanji-full-readings.show { display: flex; }
  .kfr-kanji {
    font-family: 'Shippori Mincho', serif;
    font-size: min(20vw, 22vh);
    line-height: 1;
    color: var(--ink);
    opacity: 0.55;
    white-space: nowrap;
  }
  .kfr-row {
    display: flex;
    align-items: baseline;
    gap: 16px;
    white-space: nowrap;
  }
  .kfr-label {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: min(4.5vw, 5vh);
    color: var(--ink-soft);
  }
  .kfr-value {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: min(11vw, 13vh);
  }
  .kfr-on .kfr-label, .kfr-on .kfr-value { color: var(--green); }
  .kfr-kun .kfr-label, .kfr-kun .kfr-value { color: var(--purple); }
  .kfr-on .kfr-value, .kfr-kun .kfr-value { text-shadow: 0 0 40px currentColor; }
  @media (prefers-reduced-motion: no-preference) {
    .kanji-full-readings.show .kfr-row { animation: pixelin .35s steps(5); }
  }

  .kanji-answer { cursor: pointer; }

  footer {
    margin-top: 30px;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); }
  }
</style>
</head>
<body>
  <button class="reshuffle" id="reshuffleBtn" aria-label="Перемешать заново">↻</button>
  <div class="wrap">
    <div class="grid" id="grid"></div>

    <footer>Basic Kanji Book Vol. 1 · гл. 1–5</footer>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <span class="num" id="cardNum">№ —</span>
      <button class="close" id="closeBtn" aria-label="Закрыть">✕</button>
      <div class="word-zone">
        <div class="hira" id="hiraWord"></div>
        <div class="meaning" id="meaning"></div>
      </div>
      <div class="readings" id="readingsBlock">
        <div class="read-tag on">
          <span class="label">ОН (音)</span>
          <span class="reading" id="onYomi"></span>
          <div id="onExample"></div>
        </div>
        <div class="read-tag kun">
          <span class="label">КУН (訓)</span>
          <span class="reading" id="kunYomi"></span>
          <div id="kunExample"></div>
        </div>
      </div>
      <div class="reveal-zone" id="revealZone"></div>
    </div>
  </div>

  <div class="kanji-full" id="kanjiFull">
    <span id="kanjiFullChar"></span>
    <div class="kanji-full-readings" id="kanjiFullReadings">
      <div class="kfr-kanji" id="kfrKanji"></div>
      <div class="kfr-row kfr-on"><span class="kfr-label">ОН</span><span class="kfr-value" id="kfrOn"></span></div>
      <div class="kfr-row kfr-kun"><span class="kfr-label">КУН</span><span class="kfr-value" id="kfrKun"></span></div>
    </div>
  </div>

<script>

  {k:"川", w:"かわ", m:"река", mUz:"daryo", on:"セン", onEx:["せんりゅう","сэнрю (шуточное трёхстишие)","senryu (hazil sheʼr turi)"], kun:"かわ", kunEx:["おがわ","ручей","soy"], hint:{show:"3",note:"черты · сам — ключ (река)"}},

  {k:"水", w:"みず", m:"вода", mUz:"suv", on:"スイ", onEx:["すいようび","среда","chorshanba"], kun:"みず", kunEx:["みずぎ","купальник","cho‘milish kiyimi"], group:2},
  {k:"金", w:"かね", m:"деньги; золото", mUz:"pul; oltin", on:"キン・コン・ゴン", onEx:["きんようび","пятница","juma"], kun:"かね", kunEx:["おかね","деньги","pul"], group:2},
  {k:"土", w:"つち", m:"земля; почва", mUz:"yer; tuproq", on:"ド・ト", onEx:["どようび","суббота","shanba"], kun:"つち", kunEx:["あかつち","красная глина","qizil loy"], group:2},
  {k:"子", w:"こ", m:"ребёнок", mUz:"bola", on:"シ・ス", onEx:["ぼうし","шляпа","bosh kiyim"], kun:"こ", kunEx:["おんなのこ","девочка","qiz bola"], hint:{show:"3",note:"черты · сам — ключ (ребёнок)"}},

  {k:"一", w:"いち", m:"один", mUz:"bir", on:"イチ・イツ", onEx:["いちばん","номер один; лучший","birinchi raqam; eng yaxshi"], kun:"ひと(つ)", kunEx:["ひとつ","один (предмет)","bitta (narsa)"], group:2},

  {k:"三", w:"さん", m:"три", mUz:"uch", on:"サン", onEx:["さんがつ","март","mart"], kun:"み(つ)", kunEx:["みっつ","три (предмета)","uchta (narsa)"], group:2},
  {k:"四", w:"よん", m:"четыре", mUz:"to‘rt", on:"シ", onEx:["しがつ","апрель","aprel"], kun:"よ・よん", kunEx:["よっつ","четыре (предмета)","to‘rtta (narsa)"], group:2},
  {k:"五", w:"ご", m:"пять", mUz:"besh", on:"ゴ", onEx:["ごがつ","май","may"], kun:"いつ(つ)", kunEx:["いつつ","пять (предметов)","beshta (narsa)"], group:2},
  {k:"六", w:"ろく", m:"шесть", mUz:"olti", on:"ロク", onEx:["ろくがつ","июнь","iyun"], kun:"む(つ)", kunEx:["むっつ","шесть (предметов)","oltita (narsa)"], group:2},
  {k:"七", w:"なな", m:"семь", mUz:"yetti", on:"シチ", onEx:["しちがつ","июль","iyul"], kun:"なな(つ)", kunEx:["ななつ","семь (предметов)","yettita (narsa)"], group:2},
  {k:"八", w:"はち", m:"восемь", mUz:"sakkiz", on:"ハチ", onEx:["はちがつ","август","avgust"], kun:"や(つ)", kunEx:["やっつ","восемь (предметов)","sakkizta (narsa)"], group:2},

  {k:"本", w:"ほん", m:"книга", mUz:"kitob", on:"ホン", onEx:["にほん","Япония","Yaponiya"], kun:"もと", kunEx:["—","отдельно почти не встречается","alohida deyarli uchramaydi"], hint:{show:"木",note:"внутри: 木 (дерево) + черта у корня"}},
  {k:"半", w:"はん", m:"половина", mUz:"yarim", on:"ハン", onEx:["はんぶん","половина","yarim"], kun:"なか(ば)", kunEx:["なかば","середина, половина","o‘rta, yarim"], hint:{show:"5",note:"черт · сам — ключ"}},
  {k:"分", w:"ふん", m:"минута; часть", mUz:"daqiqa; qism", on:"ブン・フン・ブ", onEx:["じぶん","сам, себя","o‘zi, o‘zini"], kun:"わ(かる)", kunEx:["わかる","понимать","tushunmoq"], hint:{show:"刀",note:"нижняя часть: 刀 (нож)"}},
  {k:"力", w:"ちから", m:"сила", mUz:"kuch", on:"リョク・リキ", onEx:["たいりょく","физическая сила","jismoniy kuch"], kun:"ちから", kunEx:["ちからもち","силач","kuchli odam"], hint:{show:"2",note:"черты · сам — ключ"}},
  {k:"何", w:"なに", m:"что", mUz:"nima", on:"カ", onEx:["きかがく","геометрия","geometriya"], kun:"なに・なん", kunEx:["なにか","что-то","nimadir"], hint:{show:"イ",note:"левая часть: イ (человек)"}},

  {k:"明", w:"あかるい", m:"светлый", mUz:"yorug‘", on:"メイ・ミョウ", onEx:["せつめい","объяснение","tushuntirish"], kun:"あか(るい)", kunEx:["あした","завтра","ertaga"], hint:{show:"日",note:"левая часть: 日 (солнце), справа 月"}},
  {k:"休", w:"やすむ", m:"отдыхать", mUz:"dam olmoq", on:"キュウ", onEx:["きゅうじつ","выходной день","dam olish kuni"], kun:"やす(む)", kunEx:["やすみ","отдых, каникулы","dam olish, ta’til"], hint:{show:"イ",note:"левая часть: イ (человек) у дерева"}},
  {k:"体", w:"からだ", m:"тело", mUz:"tana", on:"タイ", onEx:["たいいく","физкультура","jismoniy tarbiya"], kun:"からだ", kunEx:["からだつき","телосложение","tana tuzilishi"], hint:{show:"イ",note:"левая часть: イ (человек)"}},
  {k:"好", w:"すき", m:"нравящийся", mUz:"yoqimli", on:"コウ", onEx:["こうぶつ","любимая еда","sevimli taom"], kun:"す(き)・この(む)", kunEx:["このむ","предпочитать","afzal ko‘rmoq"], hint:{show:"女",note:"левая часть: 女 (женщина)"}},
  {k:"男", w:"おとこ", m:"мужчина", mUz:"erkak", on:"ダン・ナン", onEx:["だんじょ","мужчина и женщина","erkak va ayol"], kun:"おとこ", kunEx:["おとこのこ","мальчик","o‘g‘il bola"], hint:{show:"田",note:"верхняя часть: 田 (поле)"}},
  {k:"林", w:"はやし", m:"лес; роща", mUz:"o‘rmon; bog‘cha", on:"リン", onEx:["りんぎょう","лесное хозяйство","o‘rmon xo‘jaligi"], kun:"はやし", kunEx:["まつばやし","сосновая роща","qarag‘ay o‘rmonchasi"], group:3, compoundW:"こばやし", compoundM:"Кобаяси (японская фамилия)", compoundMUz:"Kobayasi (yapon familiyasi)", compoundK:"小林", hint:{show:"小",note:"первый иероглиф слова 小林"}},
  {k:"森", w:"もり", m:"лес", mUz:"o‘rmon", on:"シン", onEx:["しんりん","лес","o‘rmon"], kun:"もり", kunEx:["もりのなか","в лесу","o‘rmonda"], hint:{show:"木",note:"три дерева: 木木木"}},
  {k:"間", w:"あいだ", m:"промежуток", mUz:"oraliq", on:"カン・ケン", onEx:["じかん","время","vaqt"], kun:"あいだ・ま", kunEx:["まにあう","успевать","ulgurmoq"], group:3, compoundW:"にんげん", compoundM:"человек; человечество", compoundMUz:"inson; insoniyat", compoundK:"人間", hint:{show:"人",note:"первый иероглиф слова 人間"}},
  {k:"畑", w:"はたけ", m:"поле, огород", mUz:"dala, bog‘", on:"—(кокудзи)", onEx:["—","нет онного чтения","on o‘qilishi yo‘q"], kun:"はたけ", kunEx:["はなばたけ","цветочное поле","gulzor"], hint:{show:"火",note:"левая часть: 火 (огонь)"}},
  {k:"岩", w:"いわ", m:"скала", mUz:"qoya", on:"ガン", onEx:["がんせき","горная порода","tog‘ jinsi"], kun:"いわ", kunEx:["いわやま","скалистая гора","qoyali tog‘"], hint:{show:"山",note:"верхняя часть: 山 (гора)"}}
];

let order = [];        // order[cellIndex] = index into KANJI
let opened = new Set();
let hinted = new Set();
let revealed = new Set();
let currentCell = null;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildGrid() {
  order = shuffle([...Array(KANJI.length).keys()]);
  opened = new Set();
  hinted = new Set();
  revealed = new Set();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 0; i < 55; i++) {
    const cell = document.createElement('button');
    cell.className = 'cell';
    cell.textContent = i + 1;
    cell.setAttribute('aria-label', 'Ячейка ' + (i + 1));
    cell.addEventListener('click', () => openCell(i));
    grid.appendChild(cell);
  }
  updateStatus();
}

function updateStatus() {
  document.querySelectorAll('.cell').forEach((cell, i) => {
    cell.classList.toggle('opened', opened.has(i));
    cell.classList.toggle('revealed', revealed.has(i));
  });
}

function renderExample(ex) {
  if (!ex || ex[0] === '—') {
    const uzNote = ex && ex[2] ? '<span class="ex-mean-uz">' + ex[2] + '</span>' : '';
    return '<span class="no-ex">' + (ex ? ex[1] : '') + uzNote + '</span>';
  }
  const uz = ex[2] ? '<span class="ex-mean-uz">' + ex[2] + '</span>' : '';
  return '<span class="example"><span class="ex-word">' + ex[0] +
    '</span><span class="ex-mean">' + ex[1] + '</span>' + uz + '</span>';
}

function fillReadings(item) {
  document.getElementById('onYomi').textContent = item.on;
  document.getElementById('kunYomi').textContent = item.kun;
  document.getElementById('onExample').innerHTML = renderExample(item.onEx);
  document.getElementById('kunExample').innerHTML = renderExample(item.kunEx);
}

function renderMeaning(m, mUz) {
  return m + (mUz ? ' <span class="meaning-uz">/ ' + mUz + '</span>' : '');
}

function renderHintBox(zone, hint, onNext) {
  zone.innerHTML =
    '<div class="hint-box"><span class="hint-char">' + hint.show + '</span>' +
    '<span class="hint-note">' + hint.note + '</span></div>' +
    '<button class="stamp-btn" id="hintNextBtn">Показать полностью</button>';
  document.getElementById('hintNextBtn').addEventListener('click', onNext);
}

function renderAnswerBox(zone, answer) {
  zone.innerHTML = '<div class="kanji-answer" id="kanjiBox">' + answer + '</div>';
  const box = document.getElementById('kanjiBox');
  if (answer.length > 1) {
    box.style.width = (40 + 46 * answer.length) + 'px';
    box.style.fontSize = Math.round(64 / Math.sqrt(answer.length)) + 'px';
  }
  box.addEventListener('click', () => openFullscreen(answer));
}

function openCell(i) {
  currentCell = i;
  opened.add(i);
  const item = KANJI[order[i]];
  const group = item.group || 1;
  document.getElementById('cardNum').textContent = '№ ' + (i + 1);
  const readingsBlock = document.getElementById('readingsBlock');
  const zone = document.getElementById('revealZone');

  if (group === 3) {
    document.getElementById('hiraWord').textContent = item.compoundW;
    document.getElementById('meaning').innerHTML = renderMeaning(item.compoundM, item.compoundMUz);
    readingsBlock.style.display = 'none';
    readingsBlock.onclick = null;
    if (revealed.has(i)) {
      renderAnswerBox(zone, item.compoundK);
    } else if (hinted.has(i)) {
      renderHintBox(zone, item.hint, () => reveal(i));
    } else {
      zone.innerHTML = '<button class="stamp-btn" id="stampBtn">Показать подсказку</button>';
      document.getElementById('stampBtn').addEventListener('click', () => showHint(i));
    }
  } else if (group === 2) {
    document.getElementById('hiraWord').textContent = item.k;
    document.getElementById('meaning').innerHTML = renderMeaning(item.m, item.mUz);
    fillReadings(item);
    zone.innerHTML = '';
    if (revealed.has(i)) {
      readingsBlock.style.display = 'flex';
      readingsBlock.style.cursor = 'pointer';
      readingsBlock.onclick = () => openFullscreenReadings(item);
    } else {
      readingsBlock.style.display = 'none';
      readingsBlock.onclick = null;
      zone.innerHTML = '<button class="stamp-btn" id="stampBtn">Показать чтения</button>';
      document.getElementById('stampBtn').addEventListener('click', () => reveal(i));
    }
  } else {
    document.getElementById('hiraWord').textContent = item.w;
    document.getElementById('meaning').innerHTML = renderMeaning(item.m, item.mUz);
    fillReadings(item);
    readingsBlock.style.display = 'flex';
    readingsBlock.style.cursor = 'default';
    readingsBlock.onclick = null;
    if (revealed.has(i)) {
      renderAnswerBox(zone, item.k);
    } else if (hinted.has(i)) {
      renderHintBox(zone, item.hint, () => reveal(i));
    } else {
      zone.innerHTML = '<button class="stamp-btn" id="stampBtn">Показать подсказку</button>';
      document.getElementById('stampBtn').addEventListener('click', () => showHint(i));
    }
  }

  document.getElementById('overlay').classList.add('show');
  updateStatus();
}

function showHint(i) {
  hinted.add(i);
  openCell(i);
  updateStatus();
}

function reveal(i) {
  revealed.add(i);
  const item = KANJI[order[i]];
  const group = item.group || 1;
  openCell(i);
  if (group === 1) openFullscreen(item.k);
  if (group === 2) openFullscreenReadings(item);
  if (group === 3) openFullscreen(item.compoundK);
  updateStatus();
}

function openFullscreen(str) {
  document.getElementById('kanjiFullReadings').classList.remove('show');
  const el = document.getElementById('kanjiFullChar');
  el.style.display = '';
  el.textContent = str;
  if (str.length === 1) {
    el.style.fontSize = '';
  } else if (str.length === 2) {
    el.style.fontSize = 'min(38vw, 46vh)';
  } else {
    el.style.fontSize = 'min(27vw, 34vh)';
  }
  document.getElementById('kanjiFull').classList.add('show');
}

function openFullscreenReadings(item) {
  document.getElementById('kanjiFullChar').style.display = 'none';
  document.getElementById('kfrKanji').textContent = item.k;
  document.getElementById('kfrOn').textContent = item.on;
  document.getElementById('kfrKun').textContent = item.kun;
  document.getElementById('kanjiFullReadings').classList.add('show');
  document.getElementById('kanjiFull').classList.add('show');
}

function closeFullscreen() {
  document.getElementById('kanjiFull').classList.remove('show');
}

function closeCard() {
  document.getElementById('overlay').classList.remove('show');
  currentCell = null;
}

document.getElementById('kanjiFull').addEventListener('click', closeFullscreen);
document.getElementById('closeBtn').addEventListener('click', closeCard);
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeCard();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('kanjiFull').classList.contains('show')) {
      closeFullscreen();
    } else {
      closeCard();
    }
  }
});
document.getElementById('reshuffleBtn').addEventListener('click', buildGrid);

buildGrid();
</script>
